name: Update election news and results

# GitHub의 예약 실행은 새 저장소에서 자주 밀리거나 안 돌아서,
# 한 번 시작하면 약 5시간 40분 동안 2분마다 직접 갱신하고, 끝날 때 자기 자신을 다시 실행한다.
on:
  schedule:
    - cron: "*/15 * * * *"   # 혹시 멈췄을 때 다시 살리는 용도
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update every 2 minutes
        env:
          # 저장소 Secrets에 넣은 유튜브 키 (이름이 달라도 아래 중 하나면 된다)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            python scripts/fetch_news.py || true
            python scripts/fetch_results.py || true
            python scripts/fetch_youtube.py || true
            git add news.json results.json live.json
            if ! git diff --cached --quiet; then
              git commit -q -m "Update news and results"
              for i in 1 2 3; do
                git pull -q --rebase -X theirs && git push -q && break
                sleep 5
              done
            fi
            sleep 120
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news.yml --ref main || true
