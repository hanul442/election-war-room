name: Update election news and results

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub 사정에 따라 몇 분씩 늦게 돌 수 있음
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_news.py
      - run: python scripts/fetch_results.py
      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add news.json results.json
          git diff --cached --quiet || (git commit -m "Update news" && git pull --rebase && git push)
